<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>DJOUSSE TECH - Connexion WhatsApp</title>
  <style>
    :root { color-scheme: dark; font-family: system-ui, sans-serif; background: #08111f; color: #f4f7fb; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: radial-gradient(circle at top, #123453, #08111f 60%); }
    main { width: min(92vw, 440px); padding: 28px; border: 1px solid #24415f; border-radius: 18px; background: #0d1b2b; box-shadow: 0 20px 60px #0006; }
    h1 { margin-top: 0; font-size: 25px; }
    p { color: #b7c8d9; line-height: 1.5; }
    input, button { width: 100%; box-sizing: border-box; padding: 14px; margin-top: 12px; border-radius: 10px; font: inherit; }
    input { border: 1px solid #365878; background: #08111f; color: #fff; }
    button { border: 0; background: #19b778; color: #06150f; font-weight: 700; cursor: pointer; }
    button:disabled { opacity: .6; cursor: wait; }
    #result { margin-top: 20px; white-space: pre-wrap; }
    code { color: #7de2b3; font-size: 24px; letter-spacing: 3px; }
  </style>
</head>
<body>
  <main>
    <h1>Connexion WhatsApp</h1>
    <p>Cette application utilise le code officiel WhatsApp. Elle ne lit pas les fichiers privés de WhatsApp et ne demande pas l’accès root.</p>
    <label for="server">Adresse du serveur DJOUSSE TECH</label>
    <input id="server" value="https://djousse-tech-md.onrender.com" autocomplete="url">
    <label for="phone">Numéro WhatsApp au format international</label>
    <input id="phone" placeholder="237693978044" inputmode="numeric" autocomplete="tel">
    <button id="pair">Demander un code officiel</button>
    <div id="result" role="status"></div>
  </main>
  <script>
    const server = document.querySelector('#server');
    const phone = document.querySelector('#phone');
    const button = document.querySelector('#pair');
    const result = document.querySelector('#result');
    button.addEventListener('click', async () => {
      const number = phone.value.replace(/[^0-9]/g, '');
      if (number.length < 8 || number.length > 15) { result.textContent = 'Numéro invalide.'; return; }
      button.disabled = true;
      result.textContent = 'Demande en cours...';
      try {
        const response = await fetch(server.value.replace(/\\/$/, '') + '/api/pair?number=' + encodeURIComponent(number) + '&server=1');
        const data = await response.json();
        if (!response.ok || data.error) throw new Error(data.error || 'Serveur indisponible');
        if (data.code) {
          result.innerHTML = 'Code officiel à saisir immédiatement dans WhatsApp :<br><code>' + data.code + '</code><br><br>WhatsApp → Paramètres → Appareils liés → Connecter avec un numéro de téléphone.';
        } else result.textContent = 'Le serveur attend encore la connexion. Réessaie dans quelques secondes.';
      } catch (error) { result.textContent = 'Erreur : ' + error.message; }
      finally { button.disabled = false; }
    });
  </script>
</body>
</html>
