<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mot de passe oublié — DJOUSSE TECH</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="auth-page">
    <div class="auth-card">
      <a href="/" class="logo">
        <div class="logo-icon">DT</div>
        <span class="logo-text">DJOUSSE TECH</span>
      </a>
      <h2>Mot de passe oublié ?</h2>
      <p class="subtitle">Entrez votre email et nous vous enverrons un lien de réinitialisation.</p>

      <form id="resetForm">
        <div class="form-group">
          <label for="email">Email</label>
          <input type="email" id="email" placeholder="votre@email.com" required>
        </div>
        <button type="submit" class="btn btn-primary">Envoyer le lien</button>
      </form>

      <div class="auth-links">
        <a href="login.html">Retour à la connexion</a>
      </div>
      <div class="auth-footer">© 2026 DJOUSSE TECH EVOLUTION · <a href="terms.html">Conditions</a> · <a href="privacy.html">Confidentialité</a></div>
    </div>
  </div>

  <script>
    document.getElementById('resetForm').addEventListener('submit', (e) => {
      e.preventDefault();
      const email = document.getElementById('email').value;
      // TODO: Intégrer avec Supabase ou backend
      alert('Lien de réinitialisation envoyé à ' + email);
    });
  </script>
</body>
</html>
