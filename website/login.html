<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Connexion — DJOUSSE TECH</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="auth-page">
    <div class="auth-card">
      <a href="/" class="logo">
        <div class="logo-icon">DT</div>
        <span class="logo-text">DJOUSSE TECH</span>
      </a>
      <h2>Bonjour !</h2>
      <p class="subtitle">Connectez-vous pour gérer votre bot.</p>

      <div id="authError" style="display:none;padding:12px;border-radius:10px;background:rgba(239,68,68,0.1);color:var(--red-500);font-size:14px;margin-bottom:16px;"></div>
      <div id="authSuccess" style="display:none;padding:12px;border-radius:10px;background:rgba(16,185,129,0.1);color:var(--emerald-500);font-size:14px;margin-bottom:16px;"></div>

      <form id="loginForm">
        <div class="form-group">
          <label for="email">Email</label>
          <input type="email" id="email" placeholder="votre@email.com" required autocomplete="email">
        </div>
        <div class="form-group">
          <label for="password">Mot de passe</label>
          <input type="password" id="password" placeholder="••••••••" required autocomplete="current-password">
        </div>
        <button type="submit" id="loginBtn" class="btn btn-primary">Se connecter</button>
      </form>

      <div class="auth-links">
        <a href="forgot-password.html">Mot de passe oublié ?</a>
      </div>
      <div class="auth-links">
        Pas encore de compte ? <a href="signup.html">Créer un compte</a>
      </div>
      <div class="auth-footer">© 2026 DJOUSSE TECH EVOLUTION · <a href="terms.html">Conditions</a> · <a href="privacy.html">Confidentialité</a></div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/config.js"></script>
  <script src="js/supabase.js"></script>
  <script src="js/auth.js"></script>
</body>
</html>
