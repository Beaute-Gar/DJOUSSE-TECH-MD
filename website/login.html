<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Connexion — DJOUSSE TECH</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="auth-page">
    <div class="auth-card">
      <a href="/" class="logo">
        <div class="logo-icon">DT</div>
        <span class="logo-text">DJOUSSE TECH</span>
      </a>
      <h2>Bonjour !</h2>
      <p class="subtitle">Connectez-vous pour gérer votre bot.</p>

      <form id="loginForm">
        <div class="form-group">
          <label for="email">Email</label>
          <input type="email" id="email" placeholder="votre@email.com" required>
        </div>
        <div class="form-group">
          <label for="password">Mot de passe</label>
          <input type="password" id="password" placeholder="••••••••" required>
        </div>
        <button type="submit" class="btn btn-primary">Se connecter</button>
      </form>

      <div class="auth-links">
        <a href="forgot-password.html">Mot de passe oublié ?</a>
      </div>
      <div class="auth-links">
        Pas encore de compte ? <a href="signup.html">Créer un compte</a>
      </div>
      <div class="auth-footer">© 2026 DJOUSSE TECH EVOLUTION · <a href="terms.html">Conditions</a> · <a href="privacy.html">Confidentialité</a></div>
    </div>
  </div>

  <script>
    document.getElementById('loginForm').addEventListener('submit', (e) => {
      e.preventDefault();
      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;
      // TODO: Intégrer avec Supabase ou backend
      alert('Connexion en cours de développement. Email: ' + email);
    });
  </script>
</body>
</html>
