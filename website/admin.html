<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin — DJOUSSE TECH</title>
  <link rel="stylesheet" href="styles.css">
  <style>
    .admin-tabs {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin-bottom: 32px;
      padding-bottom: 16px;
      border-bottom: 1px solid var(--slate-200);
    }
    .admin-tab {
      padding: 8px 16px;
      border-radius: 10px;
      border: 1px solid var(--slate-200);
      background: white;
      font-size: 14px;
      font-weight: 500;
      color: var(--slate-600);
      cursor: pointer;
      transition: all 0.2s;
    }
    .admin-tab:hover {
      border-color: var(--brand-200);
      background: var(--brand-50);
    }
    .admin-tab.active {
      background: var(--brand-600);
      color: white;
      border-color: var(--brand-600);
    }
  </style>
</head>
<body>
  <div class="dashboard-page">
    <!-- HEADER -->
    <div class="dashboard-header">
      <a href="/" class="logo">
        <div class="logo-icon">DT</div>
        <span class="logo-text">DJOUSSE TECH</span>
      </a>
      <div style="display:flex;align-items:center;gap:16px;">
        <span style="padding:4px 12px;border-radius:8px;background:rgba(124,58,237,0.1);color:var(--violet-600);font-size:12px;font-weight:600;">ADMIN</span>
        <a href="dashboard.html" class="btn btn-outline" style="padding:8px 16px;">Dashboard</a>
        <a href="#" onclick="db.signOut()" class="btn btn-outline" style="padding:8px 16px;">Déconnexion</a>
      </div>
    </div>

    <div class="dashboard-content">
      <!-- TITLE -->
      <div style="margin-bottom:32px;">
        <h1 style="font-size:28px;font-weight:800;">Panel Admin</h1>
        <p style="color:var(--slate-500);font-size:14px;">Gestion complète de la plateforme DJOUSSE TECH</p>
      </div>

      <!-- TABS -->
      <div class="admin-tabs" id="adminNav"></div>

      <!-- CONTENT -->
      <div id="adminContent">
        <div style="text-align:center;padding:48px;color:var(--slate-500);">Chargement...</div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/config.js"></script>
  <script src="js/supabase.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/admin.js"></script>
</body>
</html>
