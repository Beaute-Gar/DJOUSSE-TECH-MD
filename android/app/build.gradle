apply plugin: 'com.android.application'

android {
    namespace "com.djoussetechnology.md"
    compileSdkVersion rootProject.ext.compileSdkVersion
    ndkVersion "28.2.13676358"
    
    defaultConfig {
        applicationId "com.djoussetechnology.md"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 1
        versionName "1.0"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        
        externalNativeBuild {
            cmake {
                cppFlags ""
                arguments "-DANDROID_STL=c++_shared"
            }
        }
        ndk {
            abiFilters 'armeabi-v7a', 'arm64-v8a', 'x86_64'
        }
    }

    sourceSets {
        main {
            assets.srcDirs += ["$buildDir/generated/nodejs-assets"]
        }
    }

    externalNativeBuild {
        cmake {
            path "src/main/cpp/CMakeLists.txt"
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
    
    packagingOptions {
        jniLibs {
            pickFirsts += ['lib/x86/libc++_shared.so', 'lib/x86_64/libc++_shared.so', 'lib/armeabi-v7a/libc++_shared.so', 'lib/arm64-v8a/libc++_shared.so']
        }
    }
}

task bundleNodeJsProject(type: Zip) {
    archiveFileName = 'nodejs-project.zip'
    destinationDirectory = file("$buildDir/generated/nodejs-assets")
    
    def rootDir = file('../../')
    
    from(rootDir) {
        include 'lib/**'
        include 'src/**'
        include 'plugins/**'
        include 'packages/**'
        include 'index.cjs'
        include 'package.json'
        include 'android-bridge.cjs'
        include 'config-djousse.cjs'
        include '.env'
        include 'node_modules/**'
        
        // Exclusions Gradle 8.2+ : éviter les conflits de dossiers avec Capacitor
        exclude 'android'
        exclude 'android/**'
        exclude '.gradle'
        exclude '.gradle/**'
        exclude '.idea'
        exclude '.idea/**'
        exclude '.artifacts'
        exclude '.artifacts/**'
        exclude 'node_modules/@capacitor'
        exclude 'node_modules/@capacitor/**'
        exclude 'node_modules/.cache'
        exclude 'node_modules/.package-lock.json'
        exclude 'tmp'
        exclude 'tmp/**'
        exclude 'logs'
        exclude 'logs/**'
        exclude 'session*'
        exclude 'public'
        exclude 'public/**'
    }
}

// Déclaration explicite des dépendances pour éviter les erreurs Gradle 8.2+
project.afterEvaluate {
    tasks.named("generateDebugAssets").configure {
        dependsOn bundleNodeJsProject
    }
    tasks.named("generateReleaseAssets").configure {
        dependsOn bundleNodeJsProject
    }
    tasks.matching { it.name.contains("merge") && it.name.contains("Assets") }.all {
        dependsOn bundleNodeJsProject
    }
    tasks.matching { it.project.path == ':capacitor-android' }.all {
        bundleNodeJsProject.mustRunAfter(it)
    }
    tasks.matching { it.project.path == ':capacitor-cordova-android-plugins' }.all {
        bundleNodeJsProject.mustRunAfter(it)
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
    maven { url 'https://jitpack.io' }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "com.google.android.material:material:1.9.0"
    implementation "androidx.constraintlayout:constraintlayout:2.1.4"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'
