# Deploy to Render — Blueprint one-click (passe : https://render.com/deploy?repo=VOTRE_REPO)
#
# Crée automatiquement :
#   - le service Web DJOUSSE-TECH-MD
#   - le service Telegram DJOUSSE-TECH-MD
#
# MongoDB Atlas est utilisé comme base de données (pas de PostgreSQL Render).
# Configurez MONGODB_URI avec votre connexion MongoDB Atlas.

services:
  # ── Bot WhatsApp (principal) ──
  - type: web
    name: djousse-tech-md
    runtime: node
    plan: free
    rootDir: .
    buildCommand: npm install --omit=dev
    startCommand: node index.cjs
    healthCheckPath: /status
    envVars:
      - key: NODE_VERSION
        value: 20
      - key: DB_TYPE
        value: mongodb
      - key: MULTI_ACCOUNT_ENABLED
        value: "true"
      - key: PORT
        value: 3000
      - key: OWNER_NUMBER
        sync: false
      - key: PREFIX
        value: "."
      - key: BOT_NAME
        value: DJOUSSE-TECH-MD
      - key: MONGODB_URI
        sync: false
      - key: MONGO_DB_NAME
        value: djousse_tech

  # ── Bot Telegram (pairing code generator) ──
  - type: web
    name: djousse-telegram
    runtime: node
    plan: free
    rootDir: .
    buildCommand: npm install --omit=dev
    startCommand: node telegram-bot.cjs
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: 20
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_PORT
        value: 3002
      - key: BOT_URL
        value: https://djousse-tech-md.onrender.com
      - key: TELEGRAM_WEB_APP_URL
        value: https://djousse-tech-md.onrender.com
      - key: OWNER_ID
        value: "237693978044"
