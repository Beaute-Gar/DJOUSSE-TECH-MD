# Render — NB : renseigner « Blueprint Path » = deployment/render.yaml (Dashboard).
# Render — service « worker » (type: worker : AUCUN port à exposer,
# contrairement à un service web). Le bot tourne en continu et affiche
# le code d'appairage 8 caractères dans les Logs de Render.
#
# Session éphémère sur le plan gratuit : à chaque redémarrage/deploiement,
# un réappairage est nécessaire. Pour la persister, attacher un disque
# (Settings → Disks, ex. mountPath /app/state) puis définir :
#   DATA_DIR=/app/state/data
#   SESSION_DIR=/app/state/sessions/djsession
services:
  - type: worker
    name: djousse-tech-md
    runtime: docker
    dockerfilePath: ./deployment/Dockerfile
    dockerContext: .
    plan: free
    envVars:
      - key: NODE_ENV
        value: production
      - key: CONNECT_METHOD
        value: pairing
      - key: PAIRING_PHONE
        sync: false
      - key: OWNER_NUMBER
        sync: false
      - key: PREFIX
        sync: false
      - key: GEMINI_KEY
        sync: false
