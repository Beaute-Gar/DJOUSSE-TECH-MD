# Docker Compose — mise en route sur n'importe quel VPS en une commande :
#
#   docker compose -f deployment/docker-compose.yml up -d --build
#
# La session WhatsApp (storage/sessions), l'état du bot (storage/data) et ses logs
# vivent sur l'hôte : redémarrages et mises à jour ne perdent rien.
# Les secrets viennent de .env (env_file) — ce fichier n'est jamais
# commité.
services:
  djousse:
    build:
      context: ..
      dockerfile: deployment/Dockerfile
    image: djousse-tech-md:latest
    container_name: djousse-tech-md
    restart: unless-stopped
    env_file: ../.env
    volumes:
      - ../storage/sessions:/app/storage/sessions
      - ../storage/data:/app/storage/data
      - ../storage/logs:/app/storage/logs
      - ../storage/downloads:/app/storage/downloads
    # Par défaut : AUCUN port exposé (le bot est un worker).
    # Pour activer l'API de jumelage (PAIRING_API=on dans .env) et servir
    # le site web sur le même port (SERVE_SITE=on), décommente :
    # ports:
    #   - "8089:8089"
